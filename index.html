<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080d16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="铁馆计划">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>铁馆计划 · 4 分化</title>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="appbar-title">铁馆计划</div>
    <div class="appbar-sub" id="appbarSub">4 分化 · 固定器械</div>
  </header>

  <main id="view"></main>

  <nav class="navbar">
    <button data-tab="plan" class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>计划</span>
    </button>
    <button data-tab="log" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>记录</span>
    </button>
    <button data-tab="progress" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16l4-6 3 3 5-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>进度</span>
    </button>
    <button data-tab="gallery" class="nav-btn">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M5 17l4-4 3 3 3-4 4 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      <span>器械</span>
    </button>
  </nav>
</div>

<div id="sheet" class="sheet-mask hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="详情">
    <div class="sheet-grab"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
