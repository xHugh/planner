<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="铁馆计划">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="mask-icon" href="icons/app-icon.svg" color="#2563eb">
<link rel="stylesheet" href="style.css">
<title>铁馆计划 · 4 分化</title>
<script>
/* 首屏前解析主题，避免刷新时先闪一下错误配色 */
(function () {
  try {
    var m = localStorage.getItem("gym4.theme") || "auto";
    var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="appbar-brand">
      <div class="appbar-title">铁馆计划</div>
      <div class="appbar-sub" id="appbarSub">4 分化 · 固定器械</div>
    </div>
    <button id="themeBtn" class="theme-btn" type="button" aria-label="切换主题">
      <svg class="ico-auto" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.8" fill="none"/>
        <path d="M12 3.6v16.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor"/>
      </svg>
      <svg class="ico-light" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.6" fill="currentColor"/>
        <path d="M12 2.4v2.6M12 19v2.6M2.4 12H5M19 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"
              stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <svg class="ico-dark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.6A8.8 8.8 0 0 1 9.4 3.5a8.8 8.8 0 1 0 11.1 11.1z"
              stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="navbar">
    <button data-tab="plan" class="nav-btn active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.2" y="5" width="17.6" height="15.6" rx="3.2" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M3.2 9.6h17.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 3.4v3.4M16 3.4v3.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="8.6" cy="14.6" r="1.55" fill="currentColor"/>
        <circle cx="12" cy="14.6" r="1.55" fill="currentColor"/>
        <circle cx="8.6" cy="17.8" r="1.55" fill="currentColor"/>
      </svg>
      <span>计划</span>
    </button>
    <button data-tab="log" class="nav-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 4.4H6.4A2.4 2.4 0 0 0 4 6.8v12.8A2.4 2.4 0 0 0 6.4 22h11.2a2.4 2.4 0 0 0 2.4-2.4V6.8a2.4 2.4 0 0 0-2.4-2.4H16"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        <rect x="8" y="2.6" width="8" height="3.6" rx="1.6" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M8.6 13.4l2.4 2.4 4.4-4.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span>记录</span>
    </button>
    <button data-tab="progress" class="nav-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 19.5v-6M12 19.5V7M17 19.5v-9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>进度</span>
    </button>
  </nav>
</div>

<div id="sheet" class="sheet-mask hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="详情">
    <div class="sheet-grab"></div>
    <div id="sheetHeader" class="sheet-header"></div>
    <div id="sheetBody" class="sheet-content"></div>
    <div id="sheetFooter" class="sheet-footer hidden"></div>
  </div>
</div>

<div id="workoutDock" class="workout-dock hidden">
  <div class="wo-dock-bar">
    <div class="wo-dock-track"><div id="woDockFill" class="wo-dock-fill"></div></div>
    <div class="wo-dock-meta">
      <span id="woDockCount">已完成 0/0 组</span>
      <span id="woDockTimer" class="wo-dock-timer">--:--</span>
    </div>
  </div>
  <div class="wo-dock-actions">
    <button id="woExitBtn" class="btn outline" type="button">保存并退出</button>
    <button id="woFinishBtn" class="btn solid" type="button">完成训练</button>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
