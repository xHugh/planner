<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="铁馆计划">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="52%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- 杠铃：横杆 + 内大片 + 半透明外片，比例经过小尺寸验证 -->
  <rect x="104" y="243" width="304" height="26" rx="13" fill="#ffffff"/>
  <rect x="150" y="184" width="34" height="144" rx="15" fill="#ffffff"/>
  <rect x="328" y="184" width="34" height="144" rx="15" fill="#ffffff"/>
  <rect x="92" y="216" width="26" height="80" rx="13" fill="#ffffff" fill-opacity=".55"/>
  <rect x="394" y="216" width="26" height="80" rx="13" fill="#ffffff" fill-opacity=".55"/>

  <!-- 下方三段递减，呼应训练记录 -->
  <rect x="150" y="378" width="64" height="20" rx="10" fill="#ffffff"/>
  <rect x="224" y="378" width="64" height="20" rx="10" fill="#ffffff" fill-opacity=".72"/>
  <rect x="298" y="378" width="64" height="20" rx="10" fill="#ffffff" fill-opacity=".44"/>
</svg>
